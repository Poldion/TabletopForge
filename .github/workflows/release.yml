# Veröffentlicht ein Release-Tag (v1.2.3) als Docker-Image für amd64 und arm64 und legt das GitHub-Release mit dem
# passenden Abschnitt aus CHANGELOG.md an.
# Benötigt die Repository-Secrets DOCKERHUB_USERNAME und DOCKERHUB_TOKEN sowie optional die Variable IMAGE
# (Standard: poldion/tabletop-forge).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  docker:
    runs-on: ubuntu-latest
    env:
      IMAGE: ${{ vars.IMAGE || 'poldion/tabletop-forge' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Version aus dem Tag (v1.2.3 → 1.2.3)
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ env.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: GitHub-Release mit den Notizen aus CHANGELOG.md
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          awk -v v="$VERSION" '/^## /{p = index($0, "[" v "]") > 0; next} p' CHANGELOG.md > notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
