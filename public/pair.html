<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Anzeige koppeln – Tabletop Forge</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/style.css" />
    <style>
      body {
        background: #0b0a08;
        overflow: hidden;
      }
      .pair {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6vh;
        padding: 4vh;
        box-sizing: border-box;
        font-family: 'DejaVu Serif', Georgia, serif;
        color: #d8c9a5;
      }
      .pair-qr {
        width: min(46vh, 42vw);
        aspect-ratio: 1;
        background: #fff;
        border-radius: 1.4vh;
        padding: 1vh;
        box-sizing: border-box;
      }
      .pair-qr img {
        display: block;
        width: 100%;
        height: 100%;
      }
      .pair-text {
        max-width: 46vw;
      }
      .pair-text h1 {
        margin: 0 0 1.5vh;
        font-weight: normal;
        font-size: 5vh;
        color: #c9a24a;
      }
      .pair-text p {
        margin: 1vh 0;
        font-size: 2.4vh;
        line-height: 1.45;
      }
      .pair-code {
        margin: 2.5vh 0;
        font-family: 'DejaVu Sans Mono', ui-monospace, monospace;
        font-size: 9vh;
        letter-spacing: 0.12em;
        color: #fff;
      }
      .pair-hint {
        color: #8a7d63;
        font-size: 2vh !important;
        word-break: break-all;
      }
      @media (orientation: portrait) {
        .pair {
          flex-direction: column;
          text-align: center;
        }
        .pair-qr {
          width: min(60vw, 40vh);
        }
        .pair-text {
          max-width: 90vw;
        }
      }
    </style>
  </head>
  <body>
    <main class="pair">
      <div class="pair-qr"><img id="qr" alt="" /></div>
      <div class="pair-text">
        <h1 data-t>Anzeige freigeben</h1>
        <p id="msg" data-t>Verbinde …</p>
        <div class="pair-code" id="code"></div>
        <p class="pair-hint" id="hint"></p>
      </div>
    </main>
    <script type="module" src="/js/pair.js"></script>
  </body>
</html>
