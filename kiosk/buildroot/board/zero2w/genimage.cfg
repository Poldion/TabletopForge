# SD-Karte: Boot-Partition (Firmware, kiosk.json, Systemplätze a/ und b/ mit Kernel) und zwei
# Root-Partitionen (SquashFS) für A/B-Updates. Platz B ist anfangs leer – das erste Update landet dort.
image boot.vfat {
	vfat {
		label = "BOOT"
		files = {
			"rpi-firmware/bootcode.bin",
			"rpi-firmware/start.elf",
			"rpi-firmware/fixup.dat",
			"rpi-firmware/config.txt",
			"kiosk.json",
			"kiosk.json.bak"
		}
		file a {
			image = "slot-a"
		}
	}
	size = 256M
}

image sdcard.img {
	hdimage {
		# Partitionen auf 4 MB ausrichten (Löschblöcke der SD-Karte) – schneller und schonender beim Schreiben
		align = 4M
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
	}

	partition rootfs-a {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 512M
	}

	partition rootfs-b {
		partition-type = 0x83
		size = 512M
	}
}
