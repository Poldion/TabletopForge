# Hardware-Watchdog: hängt das System (z.B. Grafikspeicher voll, neues System nach einem Update startet
# nicht richtig), startet der Pi nach 14 s von selbst neu. Nach einem missglückten Update landet er dabei
# automatisch wieder im vorherigen System (Probestart über tryboot gilt nur einmal).
[Manager]
RuntimeWatchdogSec=14
RebootWatchdogSec=2min
