# NetworkManager auf dem Kiosk
[main]
plugins=keyfile
# Hotspot (Einrichtungsmodus) braucht kein NAT – keine Firewall-Regeln anlegen
firewall-backend=none

[connectivity]
enabled=false

[device]
wifi.scan-rand-mac-address=no

[connection]
# WLAN-Stromsparen aus: sonst verzögerte Reaktion bei Live-Änderungen am Tisch
wifi.powersave=2
