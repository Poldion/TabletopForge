# SD-Karte für den Orange Pi Zero 2W: U-Boot (mit SPL und ATF) ab 8 KB, Boot-Partition (startskript, kiosk.json,
# Systemplätze a/ und b/ mit Kernel) und zwei Root-Partitionen (SquashFS) für A/B-Updates.
# Platz B ist anfangs leer – das erste Update landet dort.
image boot.vfat {
	vfat {
		label = "KIOSK"
		files = {
			"boot.scr",
			"kiosk-boot.txt",
			"kiosk.json",
			"kiosk.json.bak"
		}
		file a {
			image = "slot-a"
		}
	}
	size = 256M
}

image sdcard.img {
	hdimage {
		# Partitionen auf 4 MB ausrichten (Löschblöcke der SD-Karte)
		align = 4M
	}

	# Allwinner: Boot-ROM lädt SPL/U-Boot ab Sektor 16 (8 KB), außerhalb der Partitionstabelle
	partition u-boot {
		in-partition-table = false
		image = "u-boot-sunxi-with-spl.bin"
		offset = 8K
		size = 4088K
	}

	partition boot {
		partition-type = 0xC
		bootable = "true"
		image = "boot.vfat"
		offset = 4M
	}

	partition rootfs-a {
		partition-type = 0x83
		image = "rootfs.squashfs"
		size = 512M
	}

	partition rootfs-b {
		partition-type = 0x83
		size = 512M
	}
}
