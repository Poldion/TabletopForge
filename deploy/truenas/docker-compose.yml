# TrueNAS SCALE (24.10+): Apps → Discover Apps → ⋮ → „Install via YAML“
# Das Volume „dnd-data“ wird von TrueNAS automatisch im App-Dataset (ix-apps) angelegt –
# kein eigenes Dataset und keine Rechtevergabe nötig. (Der Name stammt aus der Zeit vor der Umbenennung in
# Tabletop Forge und bleibt so, damit bestehende Installationen ihre Daten behalten.)
services:
  tabletop-forge:
    image: docker.io/poldion/tabletop-forge:0.51.1
    container_name: tabletop-forge
    restart: unless-stopped
    ports:
      - "4300:3000"
    environment:
      TZ: Europe/Berlin
      MAX_UPLOAD_MB: "200"
      # Anmeldung: Der Einrichtungscode fürs erste Konto steht beim Start im Log. Hinter einem Reverse-Proxy
      # mit HTTPS (Zugriff aus dem Internet) ggf. die öffentliche Adresse für die QR-Codes angeben:
      # PUBLIC_URL: "https://forge.example.org"
    volumes:
      - dnd-data:/data
      # Alternative mit eigenem Dataset (Eigentümer apps 568:568), dann zusätzlich
      # „user: "568:568"“ beim Service setzen und die Zeile oben ersetzen durch:
      # - /mnt/tank/apps/tabletop-forge:/data

volumes:
  dnd-data:
